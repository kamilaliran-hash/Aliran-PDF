// Copies the editor from ../../aliran-desktop/web into the APK's assets and applies the
// small Android-specific changes to index.html. The desktop source stays the single source
// of truth: edit aliran-desktop/web/index.html and both builds pick it up.

def webSrc = file("${rootDir}/../aliran-desktop/web")
def webOut = layout.buildDirectory.dir("generated/aliranAssets")

// [find, replace(, "first")] — each find must occur exactly once (or, with "first", at least once:
// only the first is replaced), so a change in the editor that breaks a patch fails the build loudly.
def webPatches = [
    ["<script>",
     "<script src=\"/android.js\"></script>\n<script>", "first"],
    ["const LOCAL = /^(127\\.0\\.0\\.1|localhost)\$/.test(location.hostname) && !!location.port;",
     "const LOCAL = /^(127\\.0\\.0\\.1|localhost)\$/.test(location.hostname) && !!location.port;\nconst ANDROID = !!window.AliranAndroid;"],
    ["const DOCOPTS = LOCAL ?",
     "const DOCOPTS = (LOCAL || ANDROID) ?"],
    ["async function loadLibs() {\n  if (LOCAL) {",
     "async function loadLibs() {\n  if (LOCAL || ANDROID) {"],
    ["async function doPrint(o) {\n",
     "async function doPrint(o) {\n" +
     "  if (ANDROID) {\n" +
     "    busy('Preparing pages for printing…');\n" +
     "    try { const list = o.idx.map(i => S.pages[i]).map(p => o.markups ? p : { ...p, annots: [] }); await aliranAndroidPrint(await buildPdf(list, { ocr: false }), S.name); }\n" +
     "    finally { unbusy(); }\n" +
     "    return;\n" +
     "  }\n"],
    ["LOCAL ? 'Desktop edition for Windows' : 'Web edition'",
     "LOCAL ? 'Desktop edition for Windows' : ANDROID ? 'Android edition' : 'Web edition'"],
    ["LOCAL ? 'Aliran PDF has stopped — you can close this window' : 'Close this tab to exit'",
     "LOCAL ? 'Aliran PDF has stopped — you can close this window' : ANDROID ? 'Closing…' : 'Close this tab to exit'"],
    ["  \$('#loading').remove();\n",
     "  \$('#loading').remove();\n  if (ANDROID) setTimeout(() => window.aliranAndroidReady && aliranAndroidReady(), 0);\n"],
]

def prepareWeb = tasks.register("prepareAliranWeb") {
    inputs.dir(webSrc)
    inputs.file("web-extra/android.js")
    inputs.property("patches", webPatches.toString())
    outputs.dir(webOut)
    doLast {
        def out = webOut.get().asFile
        project.delete(out)
        project.copy {
            from(webSrc)
            into(new File(out, "web"))
            exclude("index.html")
        }
        project.copy {
            from("web-extra/android.js")
            into(new File(out, "web"))
        }
        String html = new File(webSrc, "index.html").getText("UTF-8").replace("\r\n", "\n")
        webPatches.each { p ->
            int n = html.split(java.util.regex.Pattern.quote(p[0]), -1).length - 1
            boolean first = p.size() > 2 && p[2] == "first"
            if (first ? n < 1 : n != 1) throw new GradleException("Android web patch: expected 1 match, found ${n}: ${p[0].take(60)}")
            int at = html.indexOf(p[0])
            html = html.substring(0, at) + p[1] + html.substring(at + p[0].length())
        }
        new File(out, "web/index.html").setText(html, "UTF-8")
    }
}

ext.aliranWebAssets = webOut
ext.aliranPrepareWeb = prepareWeb
