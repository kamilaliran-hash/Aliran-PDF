plugins {
    id 'com.android.application'
}

apply from: 'web-patch.gradle'

// Version follows APP_VERSION in the editor (aliran-desktop/web/index.html).
def appVersion = (file("${rootDir}/../aliran-desktop/web/index.html").getText("UTF-8") =~ /const APP_VERSION = '([0-9.]+)'/)[0][1]
def vParts = appVersion.tokenize('.').collect { it as int } + [0, 0, 0]

android {
    namespace 'com.kamil.aliranpdf'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kamil.aliranpdf'
        minSdk 24
        targetSdk 35
        versionCode vParts[0] * 10000 + vParts[1] * 100 + vParts[2]
        versionName appVersion
    }

    signingConfigs {
        release {
            // Set these as environment variables (CI secrets) to produce a signed release APK.
            def ks = System.getenv('ALIRAN_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ALIRAN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ALIRAN_KEY_ALIAS')
                keyPassword System.getenv('ALIRAN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ALIRAN_KEYSTORE')) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDir(aliranWebAssets)
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

tasks.named('preBuild') { dependsOn aliranPrepareWeb }
