name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: ./build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AliranPDF-windows
          path: dist/*.exe

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ALIRAN_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key from the ALIRAN_KEYSTORE_BASE64 secret
        if: ${{ env.KS_B64 != '' }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/aliran-release.jks"
          echo "ALIRAN_KEYSTORE=$RUNNER_TEMP/aliran-release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: aliran-desktop/android
        env:
          ALIRAN_KEYSTORE_PASSWORD: ${{ secrets.ALIRAN_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi
      - name: Collect APK
        run: |
          mkdir -p dist
          out=aliran-desktop/android/app/build/outputs/apk
          if [ -f $out/release/app-release.apk ]; then cp $out/release/app-release.apk dist/AliranPDF.apk
          else cp $out/debug/app-debug.apk dist/AliranPDF-debug.apk
            echo "::warning::No ALIRAN_KEYSTORE_BASE64 secret - built a debug-signed APK. Add the secret to sign with your release key."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AliranPDF-android
          path: dist/*.apk

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
