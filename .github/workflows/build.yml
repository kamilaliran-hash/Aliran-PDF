name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: ./build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AliranPDF-windows
          path: dist/*.exe

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ALIRAN_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK (installable, debug-signed)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Build signed release APK (only when signing secrets are set)
        if: ${{ env.KS_B64 != '' }}
        working-directory: android
        env:
          ALIRAN_KEYSTORE_PASSWORD: ${{ secrets.ALIRAN_KEYSTORE_PASSWORD }}
          ALIRAN_KEY_ALIAS: ${{ secrets.ALIRAN_KEY_ALIAS }}
          ALIRAN_KEY_PASSWORD: ${{ secrets.ALIRAN_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ALIRAN_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew --no-daemon assembleRelease
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/AliranPDF-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then cp android/app/build/outputs/apk/release/app-release.apk dist/AliranPDF.apk; fi
      - uses: actions/upload-artifact@v4
        with:
          name: AliranPDF-android
          path: dist/*.apk

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
